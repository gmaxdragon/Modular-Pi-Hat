name: Speaker CAD reference models
on:
  push:
    branches: [speaker-design-validation-tools]
    paths: [.github/workflows/speaker-cad-models.yml]
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch official KiCad component models
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, concurrent.futures, json
          paths='''Capacitor_SMD.3dshapes/C_1206_3216Metric.step
          Resistor_SMD.3dshapes/R_1206_3216Metric.step
          Connector_PinHeader_2.54mm.3dshapes/PinHeader_1x02_P2.54mm_Vertical.step
          Connector_PinHeader_2.54mm.3dshapes/PinHeader_1x03_P2.54mm_Vertical.step
          Connector_PinHeader_2.54mm.3dshapes/PinHeader_1x04_P2.54mm_Vertical.step
          Connector_PinHeader_2.54mm.3dshapes/PinHeader_1x05_P2.54mm_Vertical.step
          Connector_PinHeader_2.54mm.3dshapes/PinHeader_1x06_P2.54mm_Vertical.step
          Connector_USB.3dshapes/USB_C_Receptacle_GCT_USB4085.step
          Button_Switch_THT.3dshapes/SW_PUSH_6mm.step
          TerminalBlock_Phoenix.3dshapes/TerminalBlock_Phoenix_MKDS-1,5-2-5.08_1x02_P5.08mm_Horizontal.step
          Diode_THT.3dshapes/D_DO-201AD_P15.24mm_Horizontal.step
          Fuse.3dshapes/Fuse_1206_3216Metric.step
          Capacitor_THT.3dshapes/CP_Radial_D10.0mm_P5.00mm.step
          Connector_Audio.3dshapes/Jack_3.5mm_CUI_SJ1-3533NG_Horizontal.step
          Potentiometer_THT.3dshapes/Potentiometer_Bourns_PTV09A-2_Single_Horizontal.step
          Package_TO_SOT_SMD.3dshapes/SOT-23-6.step
          Button_Switch_THT.3dshapes/SW_Slide_SPDT_Straight_CK_OS102011MS2Q.step
          Fuse.3dshapes/Fuseholder_Blade_Mini_Keystone_3568.step
          RF_Module.3dshapes/ESP32-S3-WROOM-1.step'''
          def get(path):
              path=path.strip()
              for base in ['https://gitlab.com/kicad/libraries/kicad-packages3D/-/raw/master/','https://raw.githubusercontent.com/KiCad/kicad-packages3D/master/']:
                  url=base+urllib.parse.quote(path,safe='/,')
                  try:
                      data=urllib.request.urlopen(url,timeout=40).read()
                      if not data.startswith(b'ISO-10303-21'): continue
                      dest=pathlib.Path('models')/path; dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
                      return {'path':path,'url':url,'bytes':len(data)}
                  except Exception as e: error=str(e)
              return {'path':path,'error':error}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: results=list(pool.map(get,paths.splitlines()))
          pathlib.Path('models').mkdir(exist_ok=True)
          pathlib.Path('models/provenance.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: speaker-component-models
          path: models
          retention-days: 1
